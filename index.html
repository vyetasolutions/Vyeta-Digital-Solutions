<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vyeta Digital Solutions</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#1e3aff', // Bright premium blue matched from image.png
            darkBg: '#09090b',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom premium typography & reveal styling */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
    }

    /* Core Welcome Screen Animations */
    .logo-dot {
      transform: scale(0);
      animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.2s;
    }

    .logo-pill {
      transform: translate(-30px, -30px) scale(0.8);
      opacity: 0;
      animation: slideInPill 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 0.4s;
    }

    .logo-text {
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUpText 0.6s ease-out forwards;
      animation-delay: 0.8s;
    }

    @keyframes scaleIn {
      to { transform: scale(1); }
    }

    @keyframes slideInPill {
      to {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeUpText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Simulated Progress Micro-interaction */
    .progress-fill {
      width: 0%;
      animation: loadProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    @keyframes loadProgress {
      to { width: 100%; }
    }

    /* Seamless main landing layout reveals */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="text-zinc-100 overflow-hidden">

  <!-- ================= WELCOME SCREEN ================= -->
  <div id="welcome-screen" class="fixed inset-0 bg-darkBg z-50 flex flex-col items-center justify-center transition-all duration-700 ease-in-out">
    <div class="flex flex-col items-center space-y-6">
      
      <!-- Vector Logo Composite Formed from image.png -->
      <svg class="w-32 h-32" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Blue Dot Component -->
        <circle class="logo-dot" cx="60" cy="65" r="18" fill="#1e3aff" />
        <!-- Diagonal Rounded Pill Component -->
        <rect class="logo-pill" x="115" y="40" width="34" height="105" rx="17" transform="rotate(32 115 40)" fill="#1e3aff" />
      </svg>

      <!-- Typography Layer matched to image.png branding -->
      <div class="logo-text text-center">
        <h1 class="text-4xl font-normal tracking-wide text-zinc-300 font-sans opacity-90">
          vyeta
        </h1>
      </div>

      <!-- Tech-Style Micro Progress Indicator -->
      <div class="w-40 h-[2px] bg-zinc-800/60 rounded-full overflow-hidden relative mt-2">
        <div class="progress-fill h-full bg-brandBlue shadow-[0_0_12px_rgba(30,58,255,0.6)]"></div>
      </div>
      
    </div>
  </div>


  <!-- ================= MAIN PLATFORM LAYOUT ================= -->
  <!-- Kept hidden or fixed until loader triggers transition -->
  <main id="main-content" class="min-h-screen w-full bg-darkBg relative z-10 opacity-0 transition-opacity duration-500">
    
    <!-- Premium Navigation Bar -->
    <nav class="w-full border-b border-zinc-800/50 bg-darkBg/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-y-0 space-x-2">
        <span class="text-xl font-semibold tracking-tight bg-gradient-to-r from-zinc-100 to-zinc-400 bg-clip-text text-transparent">Vyeta</span>
        <span class="text-xs bg-brandBlue/10 text-brandBlue border border-brandBlue/20 px-2 py-0.5 rounded-full font-medium">Digital Solutions</span>
      </div>
      <div class="flex items-center space-x-6 text-sm text-zinc-400 font-medium">
        <a href="#services" class="hover:text-zinc-100 transition-colors">Services</a>
        <a href="#architecture" class="hover:text-zinc-100 transition-colors">Infrastructure</a>
        <button class="bg-zinc-100 text-zinc-950 font-semibold px-4 py-1.5 rounded-lg text-xs hover:bg-zinc-200 transition-all">Launch Console</button>
      </div>
    </nav>

    <!-- Hero Showcase Section -->
    <section class="max-w-6xl mx-auto px-6 pt-24 pb-16 text-center flex flex-col items-center">
      <div class="reveal inline-flex items-center space-x-2 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full text-xs text-zinc-400 mb-6">
        <span class="w-1.5 h-1.5 rounded-full bg-brandBlue animate-pulse"></span>
        <span>Operational Infrastructure Optimization</span>
      </div>
      
      <h2 class="reveal text-5xl md:text-6xl font-bold tracking-tight text-white max-w-3xl leading-[1.15] mb-6">
        Building high-impact software for the African enterprise.
      </h2>
      
      <p class="reveal text-zinc-400 text-lg max-w-2xl leading-relaxed mb-8">
        We conceptualize, engineer, and host robust digital architecture built for scalability, minute-value efficiency, and seamless operational flow.
      </p>

      <div class="reveal flex items-center space-x-4">
        <button class="bg-brandBlue text-white font-medium px-6 py-3 rounded-xl hover:bg-blue-600 transition-all shadow-lg shadow-brandBlue/20 text-sm">
          Explore Solutions Architecture
        </button>
        <button class="bg-zinc-900 border border-zinc-800 text-zinc-300 font-medium px-6 py-3 rounded-xl hover:bg-zinc-800 transition-all text-sm">
          Schedule Infrastructure Audit
        </button>
      </div>
    </section>

  </main>


  <!-- ================= ENGINE WORKHORSE CONTROLLER ================= -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const welcomeScreen = document.getElementById("welcome-screen");
      const mainContent = document.getElementById("main-content");

      // Set timeout perfectly synchronized with CSS loader animations (1.6s progress + exit frame buffer)
      setTimeout(() => {
        // 1. Elegantly slide up out of viewport boundary
        welcomeScreen.style.transform = "translateY(-100%)";
        
        // 2. Safely fade-in viewport layout data structures
        mainContent.classList.remove("opacity-0");
        document.body.classList.remove("overflow-hidden");

        // 3. Fire Intersection/Reveal Fallback routines manually for hero view visibility
        setTimeout(() => {
          initializeScrollObserver();
          welcomeScreen.remove(); // Prune DOM node after runtime execution to conserve memory
        }, 300);

      }, 2000); 

      // Safe intersection engine to reveal components cleanly on scroll or viewport initialization
      function initializeScrollObserver() {
        const structuralElements = document.querySelectorAll('.reveal');
        
        const appearanceOptions = {
          threshold: 0.1,
          rootMargin: "0px 0px -40px 0px"
        };

        const appearanceObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('revealed');
              observer.unobserve(entry.target);
            }
          });
        }, appearanceOptions);

        structuralElements.forEach(element => {
          appearanceObserver.observe(element);
        });

        // Fail-safe visibility initialization for viewport nodes
        structuralElements.forEach(el => {
          const coordinates = el.getBoundingClientRect();
          if (coordinates.top < window.innerHeight) {
            el.classList.add('revealed');
          }
        });
      }
    });
  </script>
</body>
</html>
